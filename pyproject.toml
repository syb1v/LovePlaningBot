[project]
name = "planning-bot"
version = "1.0.0"
description = "Telegram-бот — совместный планировщик для пары 💑"
requires-python = ">=3.12"
dependencies = [
    "aiogram~=3.24",
    "sqlalchemy[asyncio]~=2.0",
    "aiosqlite~=0.20",
    "alembic~=1.14",
    "pydantic-settings~=2.7",
    "apscheduler~=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
